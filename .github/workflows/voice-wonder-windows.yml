name: Build Windows VST3
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: cmake -S VoiceWonder -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --target UCGVoiceWonder_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: UCG-Voice-Wonder-Windows-VST3
          path: build/UCGVoiceWonder_artefacts/Release/VST3/**
