name: Build UCG Infinity 16X Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "Source/**"
      - "installer/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        shell: pwsh
        run: |
          $output = & cmake -S . -B build -G "Visual Studio 17 2022" -A x64 2>&1
          $output | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) {
            $message = (($output | Select-Object -Last 35) -join " | ")
            $message = $message.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Host "::error title=CMake configuration failed::$message"
            exit 1
          }

      - name: Build VST3 and Standalone
        shell: pwsh
        run: |
          $output = & cmake --build build --config Release --target UCGInfinity16X_VST3 UCGInfinity16X_Standalone --parallel 2 2>&1
          $output | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) {
            $errors = $output | Where-Object { $_ -match "error C[0-9]+|fatal error|LNK[0-9]+|FAILED" }
            if (-not $errors) { $errors = $output | Select-Object -Last 50 }
            $message = (($errors | Select-Object -Last 45) -join " | ")
            $message = $message.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Host "::error title=C++ build failed::$message"
            exit 1
          }

      - name: Prepare installer payload
        shell: pwsh
        run: |
          $vst = Get-ChildItem build -Recurse -Directory -Filter "UCG Infinity 16X.vst3" | Select-Object -First 1
          $exe = Get-ChildItem build -Recurse -File -Filter "UCG Infinity 16X.exe" | Select-Object -First 1
          if (-not $vst) { throw "VST3 output not found" }
          if (-not $exe) { throw "Standalone output not found" }
          New-Item -ItemType Directory -Force installer/payload/VST3 | Out-Null
          New-Item -ItemType Directory -Force installer/payload/Standalone | Out-Null
          Copy-Item $vst.FullName installer/payload/VST3/ -Recurse -Force
          Copy-Item $exe.FullName installer/payload/Standalone/ -Force

      - name: Build Windows Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          & $iscc "installer/UCG-Infinity-16X.iss"

      - name: Upload complete package
        uses: actions/upload-artifact@v4
        with:
          name: UCG-Infinity-16X-Windows-v0.2
          path: |
            dist/*.exe
            installer/payload/VST3/**
            installer/payload/Standalone/**
          if-no-files-found: error
          retention-days: 30
